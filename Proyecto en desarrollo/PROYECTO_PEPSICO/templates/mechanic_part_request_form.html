{% extends 'layout.html' %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow-lg border-0" style="background: rgba(255,255,255,0.98); border-radius: 16px;">
        <div class="card-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px 16px 0 0;">
          <h4 class="text-white mb-0">
            <i class="bi bi-box-seam"></i> Solicitar Repuesto
          </h4>
        </div>
        <div class="card-body p-4">
          <form method="POST">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="part_id" class="form-label">Repuesto *</label>
                <select class="form-select" id="part_id" name="part_id" required>
                  <option value="">Seleccionar repuesto...</option>
                  {% for part in parts %}
                  <option value="{{ part.id }}" data-stock="{{ part.stock }}">
                    {{ part.code }} - {{ part.name }} (Stock: {{ part.stock }})
                  </option>
                  {% endfor %}
                </select>
                <small class="form-text text-muted" id="stockInfo">
                  Seleccione un repuesto para ver disponibilidad
                </small>
              </div>

              <div class="col-md-6 mb-3">
                <label for="quantity" class="form-label">Cantidad *</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="quantity" 
                  name="quantity" 
                  min="1"
                  required>
              </div>
            </div>

            <div class="mb-3">
              <label for="assignment_id" class="form-label">Orden de Trabajo (Opcional)</label>
              <select class="form-select" id="assignment_id" name="assignment_id">
                <option value="">Sin orden específica</option>
                {% for assignment in assignments %}
                <option value="{{ assignment.id }}">
                  ID: {{ assignment.id }} - {{ assignment.vehicle.plate }}
                </option>
                {% endfor %}
              </select>
              <small class="form-text text-muted">Asocie esta solicitud con una orden de trabajo si aplica</small>
            </div>

            <div class="mb-3">
              <label for="note" class="form-label">Motivo / Observaciones *</label>
              <textarea 
                class="form-control" 
                id="note" 
                name="note" 
                rows="3"
                required
                placeholder="Indique para qué necesita este repuesto..."></textarea>
            </div>

            <div class="alert alert-info">
              <i class="bi bi-info-circle"></i> 
              <strong>Nota:</strong> Su solicitud será enviada al asistente de repuestos quien la revisará y procesará.
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a href="{{ url_for('mechanic_dashboard') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-send"></i> Enviar Solicitud
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<script>
// Mostrar stock disponible al seleccionar repuesto
document.getElementById('part_id').addEventListener('change', function() {
  const selectedOption = this.options[this.selectedIndex];
  const stock = selectedOption.getAttribute('data-stock');
  const stockInfo = document.getElementById('stockInfo');
  
  if (stock) {
    const stockNum = parseInt(stock);
    if (stockNum > 0) {
      stockInfo.textContent = `Stock disponible: ${stock} unidades`;
      stockInfo.className = 'form-text text-success';
    } else {
      stockInfo.textContent = 'Sin stock disponible';
      stockInfo.className = 'form-text text-danger';
    }
  } else {
    stockInfo.textContent = 'Seleccione un repuesto para ver disponibilidad';
    stockInfo.className = 'form-text text-muted';
  }
});
</script>
{% endblock %}
