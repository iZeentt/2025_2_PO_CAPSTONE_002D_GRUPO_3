{% extends 'layout.html' %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow-lg border-0" style="background: rgba(255,255,255,0.98); border-radius: 16px;">
        <div class="card-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px 16px 0 0;">
          <h4 class="text-white mb-0">
            <i class="bi bi-box-arrow-right"></i> Registrar Entrega de Repuesto
          </h4>
        </div>
        <div class="card-body p-4">
          <form method="POST" id="deliveryForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="part_id" class="form-label">Repuesto *</label>
                <select class="form-select" id="part_id" name="part_id" required>
                  <option value="">Seleccionar repuesto...</option>
                  {% for part in parts %}
                  <option value="{{ part.id }}" data-stock="{{ part.stock }}">
                    {{ part.code }} - {{ part.name }} (Stock: {{ part.stock }})
                  </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="mechanic_id" class="form-label">Mecánico *</label>
                <select class="form-select" id="mechanic_id" name="mechanic_id" required>
                  <option value="">Seleccionar mecánico...</option>
                  {% for mechanic in mechanics %}
                  <option value="{{ mechanic.id }}">
                    {% if mechanic.user %}
                      {{ mechanic.user.username }}
                    {% else %}
                      {{ mechanic.name }}
                    {% endif %}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="quantity" class="form-label">Cantidad *</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="quantity" 
                  name="quantity" 
                  min="1"
                  required>
                <small class="form-text text-muted" id="stockInfo">
                  Seleccione un repuesto para ver stock disponible
                </small>
              </div>

              <div class="col-md-6 mb-3">
                <label for="assignment_id" class="form-label">Orden de Trabajo (Opcional)</label>
                <select class="form-select" id="assignment_id" name="assignment_id">
                  <option value="">Sin orden específica</option>
                  {% for assignment in assignments %}
                  <option value="{{ assignment.id }}" data-mechanic-id="{{ assignment.mechanic_id }}">
                    ID: {{ assignment.id }} - {{ assignment.vehicle.plate }} - 
                    {% if assignment.mechanic.user %}
                      {{ assignment.mechanic.user.username }}
                    {% else %}
                      {{ assignment.mechanic.name }}
                    {% endif %}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="note" class="form-label">Nota / Observaciones</label>
              <textarea 
                class="form-control" 
                id="note" 
                name="note" 
                rows="3"
                placeholder="Ingrese cualquier observación sobre esta entrega..."></textarea>
            </div>

            <div class="alert alert-info">
              <i class="bi bi-info-circle"></i> 
              <strong>Nota:</strong> Al registrar la entrega, el stock del repuesto se actualizará automáticamente.
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a href="{{ url_for('parts_dashboard') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Registrar Entrega
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<script>
// Mostrar stock disponible al seleccionar repuesto
document.getElementById('part_id').addEventListener('change', function() {
  const selectedOption = this.options[this.selectedIndex];
  const stock = selectedOption.getAttribute('data-stock');
  const stockInfo = document.getElementById('stockInfo');
  const quantityInput = document.getElementById('quantity');
  
  if (stock) {
    stockInfo.textContent = `Stock disponible: ${stock} unidades`;
    stockInfo.className = 'form-text text-success';
    quantityInput.max = stock;
  } else {
    stockInfo.textContent = 'Seleccione un repuesto para ver stock disponible';
    stockInfo.className = 'form-text text-muted';
    quantityInput.removeAttribute('max');
  }
});

// Filtrar órdenes de trabajo según el mecánico seleccionado
document.getElementById('mechanic_id').addEventListener('change', function() {
  const selectedMechanicId = this.value;
  const assignmentSelect = document.getElementById('assignment_id');
  const allOptions = assignmentSelect.querySelectorAll('option');
  
  // Reset y limpiar selección
  assignmentSelect.value = '';
  
  // Mostrar/ocultar opciones según el mecánico
  allOptions.forEach(option => {
    if (option.value === '') {
      // Siempre mostrar la opción "Sin orden específica"
      option.style.display = '';
    } else {
      const mechanicId = option.getAttribute('data-mechanic-id');
      if (selectedMechanicId && mechanicId === selectedMechanicId) {
        option.style.display = '';
      } else if (!selectedMechanicId) {
        // Si no hay mecánico seleccionado, mostrar todas
        option.style.display = '';
      } else {
        option.style.display = 'none';
      }
    }
  });
});

// Validar cantidad antes de enviar
document.getElementById('deliveryForm').addEventListener('submit', function(e) {
  const quantityInput = document.getElementById('quantity');
  const maxStock = parseInt(quantityInput.max);
  const quantity = parseInt(quantityInput.value);
  
  if (maxStock && quantity > maxStock) {
    e.preventDefault();
    alert(`La cantidad solicitada (${quantity}) excede el stock disponible (${maxStock})`);
  }
});
</script>
{% endblock %}
