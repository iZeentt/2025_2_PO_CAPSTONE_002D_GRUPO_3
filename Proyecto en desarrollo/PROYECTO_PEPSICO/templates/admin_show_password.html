{% extends 'layout.html' %}
{% block content %}
  <div class="container">
    <h2 class="mb-3">Contraseña temporal generada</h2>
    <div class="alert alert-warning">Esta contraseña se muestra solo una vez. Copia y entrega al usuario de forma segura.</div>
    <div class="card p-3 mb-3 text-white">
      <p><strong>Usuario:</strong> {{ user.username }}</p>
      <p><strong>Rol:</strong> {{ user.role }}</p>
        <p><strong>Nueva contraseña temporal:</strong>
          <code id="new-password" data-password="{{ new_password|e }}" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace; color:inherit;">
            {{ new_password }}
          </code>
        </p>
    </div>
    <a href="{{ url_for('admin_users_list') }}" class="btn btn-secondary">Volver a usuarios</a>
    <style>
      /* Colored password characters */
      .pw-letter{ color: #11a3c8; font-weight:700 }
      .pw-digit{ color: #f5f7fa; font-weight:700 }
      .pw-symbol{ color: #ffd166; font-weight:700 }
      /* keep code readable */
      #new-password{ white-space: nowrap; }
    </style>
    <script>
      (function(){
        const el = document.getElementById('new-password');
        if(!el) return;
        const pwd = el.getAttribute('data-password') || el.textContent || '';
        // build HTML with spans per character
        let out = '';
        for(const ch of pwd){
          if(/[A-Za-z]/.test(ch)) out += `<span class="pw-letter">${ch}</span>`;
          else if(/[0-9]/.test(ch)) out += `<span class="pw-digit">${ch}</span>`;
          else out += `<span class="pw-symbol">${ch}</span>`;
        }
        el.innerHTML = out;
      })();
    </script>
  </div>
{% endblock %}
